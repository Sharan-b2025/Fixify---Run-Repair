<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us — Fixify</title>
{% include "_pwa_head.html" %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<header class="site-header">
  <button class="hamburger" aria-label="Menu">☰</button>
  {% include "_brand.html" %}
  <div class="header-spacer"></div>
  <button class="theme-toggle-btn">🌙 Dark</button>
</header>

{% include "_drawer.html" %}

<main class="page-wrap">
  <div class="page-hero">
    <h1>Get in <span>Touch</span></h1>
    <p>Found a bug, have a feature idea, or just want to say hi? Send a message below.</p>
  </div>

  <div class="content-card">
    <form id="contactForm">
      <div class="form-field">
        <label for="cName">Name</label>
        <input type="text" id="cName" required>
      </div>
      <div class="form-field">
        <label for="cEmail">Email</label>
        <input type="email" id="cEmail" required>
      </div>
      <div class="form-field">
        <label for="cMessage">Message</label>
        <textarea id="cMessage" rows="5" required></textarea>
      </div>
      <button type="submit" class="btn-primary">✉️ Send Message</button>
      <div class="form-msg" id="formMsg"></div>
    </form>
  </div>
</main>

{% include "_footer.html" %}

<script src="/static/site.js"></script>
<script>
document.getElementById('contactForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const msgBox = document.getElementById('formMsg');
  const payload = {
    name: document.getElementById('cName').value.trim(),
    email: document.getElementById('cEmail').value.trim(),
    message: document.getElementById('cMessage').value.trim()
  };
  try{
    const res = await fetch('/contact', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
    const data = await res.json();
    msgBox.textContent = data.message || '';
    msgBox.className = 'form-msg show ' + (data.status === 'ok' ? 'ok' : 'bad');
    if(data.status === 'ok') document.getElementById('contactForm').reset();
  }catch(err){
    msgBox.textContent = 'Could not send your message — please try again.';
    msgBox.className = 'form-msg show bad';
  }
});
</script>
</body>
</html>
