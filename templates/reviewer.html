<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Code Reviewer — Fixify</title>
{% include "_pwa_head.html" %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/eclipse.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Lexend:wght@400;500;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{overflow:hidden; position:relative;}

#bg-canvas{position:fixed; inset:0; z-index:0; opacity:.5;}
.glow-orb{position:fixed; border-radius:50%; filter:blur(90px); z-index:0; pointer-events:none; animation:float 12s ease-in-out infinite;}
.orb1{width:420px;height:420px; background:radial-gradient(circle, var(--accent), transparent 70%); top:-150px; left:-100px; opacity:.35;}
.orb2{width:380px;height:380px; background:radial-gradient(circle, var(--accent2), transparent 70%); bottom:-140px; right:-100px; opacity:.3; animation-delay:3s;}
@keyframes float{0%,100%{transform:translateY(0) translateX(0);} 50%{transform:translateY(30px) translateX(20px);}}

.brand-mini small{display:block; color:var(--muted); font-size:10.5px; font-weight:400; margin-top:1px;}
.header-controls{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
select{background:var(--panel2); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:8px 10px; font-family:inherit; font-size:13px; cursor:pointer; transition:.2s;}
select:hover{border-color:var(--accent);}
.font-ctrl{display:flex; align-items:center; gap:2px; background:var(--panel2); border:1px solid var(--border); border-radius:8px; padding:2px;}
.font-ctrl button{background:none; border:none; color:var(--text); padding:6px 9px; cursor:pointer; font-size:13px; border-radius:6px;}
.font-ctrl button:hover{background:rgba(124,92,255,.15);}
#voiceToggle.active{color:var(--accent2); border-color:var(--accent2);}
#dyslexiaToggle.active{color:var(--accent2); border-color:var(--accent2);}

.split{position:relative; z-index:1; display:flex; height:calc(100vh - 63px);}
.pane{flex:1; display:flex; flex-direction:column; background:var(--panel); border-right:1px solid var(--border); position:relative;}
.pane:last-child{border-right:none;}

.pane-head{display:flex; align-items:center; justify-content:space-between; padding:10px 16px; border-bottom:1px solid var(--border); background:var(--panel2); flex-wrap:wrap; gap:6px;}
.pane-head .dots{display:flex; gap:6px;}
.pane-head .dots span{width:10px; height:10px; border-radius:50%;}
.dots span:nth-child(1){background:#ff5f56;} .dots span:nth-child(2){background:#ffbd2e;} .dots span:nth-child(3){background:#27c93f;}
.pane-title{font-size:13px; color:var(--muted); font-weight:600; letter-spacing:.4px; text-transform:uppercase;}
.pane-actions{display:flex; gap:6px; flex-wrap:wrap;}
.mini-btn{background:transparent; border:1px solid var(--border); color:var(--muted); border-radius:6px; padding:5px 8px; cursor:pointer; font-size:12px; transition:.2s;}
.mini-btn:hover{color:var(--text); border-color:var(--accent2); box-shadow:0 0 8px rgba(0,230,195,.3);}

.CodeMirror{flex:1; height:100% !important; font-family:var(--mono-font) !important; font-size:14.5px; line-height:1.55; background:var(--panel) !important;}
.CodeMirror.dyslexia-font{font-family:'Lexend', sans-serif !important; letter-spacing:.2px; line-height:1.9;}
.editor-wrap{flex:1; overflow:hidden; position:relative;}

.left-footer{display:flex; flex-direction:column; gap:10px; padding:12px 16px; border-top:1px solid var(--border); background:var(--panel2);}
.mode-btn{
  width:100%; border:none; background:linear-gradient(135deg, var(--warn), #ff8a3d); color:#2b1400;
  padding:12px 14px; border-radius:10px; font-family:inherit; font-weight:700; font-size:14px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:7px; transition:.15s;
  box-shadow:0 4px 20px rgba(255,180,84,.3);
}
.mode-btn:hover{transform:translateY(-2px); box-shadow:0 6px 26px rgba(255,180,84,.45);}
.mode-btn .spinner{width:13px; height:13px; border-radius:50%; border:2px solid rgba(43,20,0,.3); border-top-color:#2b1400; animation:spin .7s linear infinite; display:none;}
.mode-btn.loading .spinner{display:inline-block;}
.mode-btn.loading .btn-icon{display:none;}
@keyframes spin{to{transform:rotate(360deg);}}

.util-row{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
.stat-chip{font-size:11.5px; color:var(--muted); display:flex; gap:14px;}
.stat-chip span b{color:var(--text);}

.output-area{flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:16px;}
.output-area::-webkit-scrollbar{width:8px;}
.output-area::-webkit-scrollbar-thumb{background:var(--border); border-radius:4px;}

.placeholder{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--muted); text-align:center; gap:10px; animation:fadeIn .6s ease;}
.placeholder .big-icon{font-size:46px; opacity:.5; animation:bob 3s ease-in-out infinite;}
@keyframes bob{0%,100%{transform:translateY(0);} 50%{transform:translateY(-10px);}}
@keyframes fadeIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}
@keyframes popIn{0%{opacity:0; transform:scale(.92) translateY(10px);} 100%{opacity:1; transform:scale(1) translateY(0);}}

.card{border-radius:14px; padding:18px; border:1px solid var(--border); background:linear-gradient(180deg, var(--panel2), var(--panel)); animation:popIn .45s cubic-bezier(.2,.9,.25,1) both;}
.card-title{display:flex; align-items:center; gap:10px; font-weight:700; font-size:15px; margin-bottom:10px; flex-wrap:wrap;}
.status-badge{font-size:11px; font-weight:700; padding:4px 10px; border-radius:20px; letter-spacing:.5px; text-transform:uppercase; background:rgba(61,220,151,.15); color:var(--success);}
.err-msg{font-size:13.5px; color:var(--text); line-height:1.6; margin-bottom:12px;}

.toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--panel2); border:1px solid var(--accent); color:var(--text); padding:10px 18px; border-radius:10px; font-size:13px; z-index:50; opacity:0; transition:.3s; pointer-events:none;}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

.score-wrap{display:flex; flex-direction:column; align-items:center; padding:10px 0 20px;}
.score-ring{width:160px; height:160px; transform:rotate(-90deg);}
.score-ring-bg{fill:none; stroke:var(--border); stroke-width:12;}
.score-ring-fill{fill:none; stroke-width:12; stroke-linecap:round; transition:stroke-dashoffset 1.1s cubic-bezier(.2,.9,.25,1), stroke 0.4s ease;}
.score-center{margin-top:-108px; text-align:center; pointer-events:none;}
.score-number{font-size:40px; font-weight:800; line-height:1;}
.score-label{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin-top:4px;}
.score-verdict{text-align:center; font-size:13.5px; color:var(--muted); max-width:340px; margin:8px auto 0; line-height:1.6;}

.review-section{margin-top:18px;}
.review-section h4{font-size:13px; text-transform:uppercase; letter-spacing:.5px; display:flex; align-items:center; gap:8px; margin-bottom:10px;}
.review-list{list-style:none; display:flex; flex-direction:column; gap:8px;}
.review-list li{font-size:13px; line-height:1.55; padding:10px 12px; border-radius:9px; border:1px solid var(--border);}
.review-list.awesome li{background:rgba(61,220,151,.08); border-color:rgba(61,220,151,.3);}
.review-list.good li{background:rgba(0,230,195,.06); border-color:rgba(0,230,195,.25);}
.review-list.improve li{background:rgba(255,180,84,.08); border-color:rgba(255,180,84,.3);}
.review-list.improve li b{display:block; margin-bottom:4px; color:var(--warn);}

.mobile-tabbar{display:none; position:fixed; bottom:0; left:0; right:0; z-index:45; background:var(--panel2); border-top:1px solid var(--border);}
.mobile-tabbar button{flex:1; padding:13px; background:none; border:none; color:var(--muted); font-family:inherit; font-weight:700; font-size:12.5px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:2px;}
.mobile-tabbar button.active{color:var(--accent2); box-shadow:inset 0 2px 0 var(--accent2);}

@media (max-width:820px){
  .split{height:calc(100vh - 63px - 52px);}
  .pane{display:none; border-right:none; width:100%;}
  .pane.mobile-active{display:flex;}
  .mobile-tabbar{display:flex;}
  .pane-actions .fs-hide-mobile{display:none;}
  .CodeMirror{font-size:15px;}
}
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<div class="glow-orb orb1"></div>
<div class="glow-orb orb2"></div>

<header class="site-header">
  <button class="hamburger" aria-label="Menu">☰</button>
  {% include "_brand.html" %}
  <div class="header-spacer"></div>
  <div class="header-controls">
    <select id="langSelect">
      <option value="auto">Auto-detect</option>
      <option value="python">Python</option>
      <option value="javascript">JavaScript</option>
      <option value="c">C</option>
      <option value="cpp">C++</option>
      <option value="java">Java</option>
      <option value="go">Go</option>
      <option value="html">HTML</option>
      <option value="sql">SQL</option>
    </select>
    <div class="font-ctrl" title="Editor font size">
      <button id="fontMinus">A−</button>
      <button id="fontPlus">A+</button>
    </div>
    <button class="header-btn" id="dyslexiaToggle" title="Dyslexia-friendly font">Aa Font</button>
    <button class="header-btn" id="voiceToggle" title="Toggle voice narration">🔊 Voice</button>
    <button class="theme-toggle-btn">🌙 Dark</button>
  </div>
</header>

{% include "_drawer.html" %}

<div class="split" id="splitView">
  <div class="pane mobile-active" id="leftPane">
    <div class="pane-head">
      <div class="dots"><span></span><span></span><span></span></div>
      <div class="pane-title">Your Code</div>
      <div class="pane-actions">
        <button class="mini-btn" id="importBtn">⬆ Import</button>
        <button class="mini-btn" id="exportBtn">⬇ Export</button>
        <button class="mini-btn" id="clearBtn">Clear</button>
        <button class="mini-btn" id="sampleBtn">Sample</button>
        <button class="mini-btn fs-hide-mobile" id="fsLeftBtn">⛶ Fullscreen</button>
      </div>
    </div>
    <div class="editor-wrap"><textarea id="codeInput"></textarea></div>
    <div class="left-footer">
      <button class="mode-btn" id="reviewBtn">
        <span class="spinner"></span><span class="btn-icon">🏆</span><span>Review This Code</span>
      </button>
      <div class="util-row">
        <div class="stat-chip">
          <span>Lines: <b id="lineCount">0</b></span>
          <span>Chars: <b id="charCount">0</b></span>
        </div>
      </div>
    </div>
  </div>

  <div class="pane" id="rightPane">
    <div class="pane-head">
      <div class="dots"><span></span><span></span><span></span></div>
      <div class="pane-title">Review</div>
      <div class="pane-actions">
        <button class="mini-btn" id="stopVoiceBtn">🔇 Stop</button>
        <button class="mini-btn fs-hide-mobile" id="fsRightBtn">⛶ Fullscreen</button>
      </div>
    </div>
    <div class="output-area" id="outputArea">
      <div class="placeholder" id="placeholder">
        <div class="big-icon">🏆</div>
        <div>Paste your code on the left and hit <b>Review This Code</b>.<br>Fixify scores it out of 100 and breaks down what's awesome, what's solid, and what to improve.</div>
      </div>
    </div>
  </div>
</div>

<div class="mobile-tabbar">
  <button id="tabCode" class="active">💻<span>Code</span></button>
  <button id="tabResult">📋<span>Review</span></button>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="importInput" accept=".py,.js,.java,.c,.cpp,.cc,.h,.go,.html,.htm,.sql,.txt" style="display:none">

<script src="/static/site.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/sql/sql.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/go/go.min.js"></script>

<script>
const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');
function resize(){canvas.width = innerWidth; canvas.height = innerHeight;}
resize(); addEventListener('resize', resize);
const particles = Array.from({length: 50}, () => ({
  x: Math.random()*innerWidth, y: Math.random()*innerHeight,
  r: Math.random()*1.6+0.4, vx:(Math.random()-.5)*.25, vy:(Math.random()-.5)*.25
}));
function loop(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = 'rgba(124,92,255,.5)';
  particles.forEach(p=>{
    p.x+=p.vx; p.y+=p.vy;
    if(p.x<0||p.x>innerWidth) p.vx*=-1;
    if(p.y<0||p.y>innerHeight) p.vy*=-1;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill();
  });
  requestAnimationFrame(loop);
}
loop();

const modeMap = {auto:'python', python:'python', javascript:'javascript', c:'text/x-csrc', cpp:'text/x-c++src', java:'text/x-java', go:'go', html:'htmlmixed', sql:'sql'};
const EXT_MAP = {auto:'txt', python:'py', javascript:'js', java:'java', c:'c', cpp:'cpp', go:'go', html:'html', sql:'sql'};
const EXT_TO_LANG = {py:'python', js:'javascript', java:'java', c:'c', h:'c', cpp:'cpp', cc:'cpp', go:'go', html:'html', htm:'html', sql:'sql', txt:'auto'};
const SAMPLES = {
  auto: `print("Hello from Fixify!")`,
  python: `print("Hello from Fixify!")`,
  javascript: `console.log("Hello from Fixify!");`,
  java: `public class Main {\n    public static void main(String[] args) {\n        System.out.println("Hello from Fixify!");\n    }\n}`,
  c: `#include <stdio.h>\n\nint main() {\n    printf("Hello from Fixify!\\n");\n    return 0;\n}`,
  cpp: `#include <iostream>\nusing namespace std;\n\nint main() {\n    cout << "Hello from Fixify!" << endl;\n    return 0;\n}`,
  go: `package main\n\nimport "fmt"\n\nfunc main() {\n    fmt.Println("Hello from Fixify!")\n}`,
  html: `<!DOCTYPE html>\n<html>\n<head><title>Fixify</title></head>\n<body>\n  <h1>Hello from Fixify!</h1>\n</body>\n</html>`,
  sql: `SELECT 'Hello from Fixify!' AS greeting;`
};

const editor = CodeMirror.fromTextArea(document.getElementById('codeInput'), {
  mode:'python', theme:'dracula', lineNumbers:true, tabSize:4, indentUnit:4,
  autoCloseBrackets:true, matchBrackets:true, lineWrapping:false
});
function currentCMTheme(){ return (document.documentElement.getAttribute('data-theme') === 'light') ? 'eclipse' : 'dracula'; }
editor.setOption('theme', currentCMTheme());
document.addEventListener('fixify-theme-changed', ()=>{ editor.setOption('theme', currentCMTheme()); });

function loadSample(lang){
  const key = SAMPLES[lang] ? lang : 'auto';
  editor.setValue(SAMPLES[key]);
}
editor.setValue(SAMPLES.python);
updateStats();
editor.on('change', updateStats);
function updateStats(){
  document.getElementById('lineCount').textContent = editor.lineCount();
  document.getElementById('charCount').textContent = editor.getValue().length;
}

document.getElementById('langSelect').addEventListener('change', e=>{
  editor.setOption('mode', modeMap[e.target.value] || 'python');
  loadSample(e.target.value);
  showToast('Sample loaded for ' + e.target.options[e.target.selectedIndex].text);
});
document.getElementById('clearBtn').addEventListener('click', ()=>{editor.setValue(''); editor.focus();});
document.getElementById('sampleBtn').addEventListener('click', ()=>{loadSample(document.getElementById('langSelect').value); showToast('Sample loaded');});

document.getElementById('fontMinus').addEventListener('click', ()=>changeFontSize(-1));
document.getElementById('fontPlus').addEventListener('click', ()=>changeFontSize(1));
let editorFontSize = 14.5;
function changeFontSize(delta){
  editorFontSize = Math.max(11, Math.min(22, editorFontSize + delta));
  editor.getWrapperElement().style.fontSize = editorFontSize + 'px';
  editor.refresh();
}
const dyslexiaBtn = document.getElementById('dyslexiaToggle');
dyslexiaBtn.addEventListener('click', ()=>{
  editor.getWrapperElement().classList.toggle('dyslexia-font');
  dyslexiaBtn.classList.toggle('active');
  editor.refresh();
});

document.getElementById('importBtn').addEventListener('click', ()=>document.getElementById('importInput').click());
document.getElementById('importInput').addEventListener('change', e=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev=>{
    editor.setValue(ev.target.result);
    const ext = file.name.split('.').pop().toLowerCase();
    const lang = EXT_TO_LANG[ext] || 'auto';
    document.getElementById('langSelect').value = lang;
    editor.setOption('mode', modeMap[lang] || 'python');
    showToast('Imported ' + file.name);
  };
  reader.readAsText(file);
  e.target.value = '';
});
document.getElementById('exportBtn').addEventListener('click', ()=>{
  const lang = document.getElementById('langSelect').value;
  const ext = EXT_MAP[lang] || 'txt';
  const blob = new Blob([editor.getValue()], {type:'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'fixify-code.' + ext;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  showToast('Exported as fixify-code.' + ext);
});

function toggleFullscreenPane(paneEl){
  if(!document.fullscreenElement){ paneEl.requestFullscreen?.() || paneEl.webkitRequestFullscreen?.(); }
  else { document.exitFullscreen?.() || document.webkitExitFullscreen?.(); }
}
document.getElementById('fsLeftBtn').addEventListener('click', ()=>toggleFullscreenPane(document.getElementById('leftPane')));
document.getElementById('fsRightBtn').addEventListener('click', ()=>toggleFullscreenPane(document.getElementById('rightPane')));
document.addEventListener('fullscreenchange', ()=>{ setTimeout(()=>editor.refresh(), 150); });

const tabCode = document.getElementById('tabCode');
const tabResult = document.getElementById('tabResult');
const leftPane = document.getElementById('leftPane');
const rightPane = document.getElementById('rightPane');
function showMobileTab(tab){
  if(tab === 'code'){
    leftPane.classList.add('mobile-active'); rightPane.classList.remove('mobile-active');
    tabCode.classList.add('active'); tabResult.classList.remove('active');
  } else {
    rightPane.classList.add('mobile-active'); leftPane.classList.remove('mobile-active');
    tabResult.classList.add('active'); tabCode.classList.remove('active');
  }
  setTimeout(()=>editor.refresh(), 100);
}
tabCode.addEventListener('click', ()=>showMobileTab('code'));
tabResult.addEventListener('click', ()=>showMobileTab('result'));
function switchToResultOnMobile(){ if(window.innerWidth <= 820) showMobileTab('result'); }

let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

let voiceOn = true;
const voiceToggle = document.getElementById('voiceToggle');
voiceToggle.classList.add('active');
voiceToggle.addEventListener('click', ()=>{
  voiceOn = !voiceOn;
  voiceToggle.textContent = voiceOn ? '🔊 Voice' : '🔈 Voice';
  voiceToggle.classList.toggle('active', voiceOn);
  if(!voiceOn) speechSynthesis.cancel();
});
document.getElementById('stopVoiceBtn').addEventListener('click', ()=>speechSynthesis.cancel());
function speak(text){
  if(!voiceOn || !('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.rate = 1; utter.pitch = 1;
  speechSynthesis.speak(utter);
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str ?? '';
  return div.innerHTML;
}

async function postJSON(url, body){
  const res = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  return res.json();
}

const reviewBtn = document.getElementById('reviewBtn');
const outputArea = document.getElementById('outputArea');
reviewBtn.addEventListener('click', runReview);

async function runReview(){
  const code = editor.getValue();
  const language = document.getElementById('langSelect').value;
  reviewBtn.classList.add('loading');
  switchToResultOnMobile();
  try{
    const data = await postJSON('/review', {code, language});
    renderReview(data);
  }catch(err){
    document.getElementById('placeholder')?.remove();
    outputArea.innerHTML = `<div class="card"><div class="card-title">⚠️ Review Failed</div><div class="err-msg">Could not reach the Fixify server.</div></div>`;
  }finally{
    reviewBtn.classList.remove('loading');
  }
}

function scoreColor(score){
  if(score >= 80) return getComputedStyle(document.documentElement).getPropertyValue('--success').trim();
  if(score >= 50) return getComputedStyle(document.documentElement).getPropertyValue('--warn').trim();
  return getComputedStyle(document.documentElement).getPropertyValue('--danger').trim();
}

function renderReview(data){
  document.getElementById('placeholder')?.remove();
  outputArea.innerHTML = '';

  const score = Math.max(0, Math.min(100, data.score || 0));
  const r = 60;
  const circumference = 2 * Math.PI * r;
  const offset = circumference - (circumference * score / 100);
  const color = scoreColor(score);

  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="card-title">🏆 Fixify Code Reviewer <span class="status-badge">Score</span></div>
    <div class="score-wrap">
      <svg class="score-ring" viewBox="0 0 140 140">
        <circle class="score-ring-bg" cx="70" cy="70" r="${r}"></circle>
        <circle class="score-ring-fill" cx="70" cy="70" r="${r}" stroke="${color}" stroke-dasharray="${circumference}" stroke-dashoffset="${circumference}"></circle>
      </svg>
      <div class="score-center">
        <div class="score-number" style="color:${color}">${score}</div>
        <div class="score-label">out of 100</div>
      </div>
      <div class="score-verdict">${escapeHtml(data.summary || '')}</div>
    </div>
    ${(data.awesome && data.awesome.length) ? `<div class="review-section"><h4>🌟 Awesome</h4><ul class="review-list awesome">${data.awesome.map(a=>`<li>${escapeHtml(a)}</li>`).join('')}</ul></div>` : ''}
    ${(data.good && data.good.length) ? `<div class="review-section"><h4>👍 Good</h4><ul class="review-list good">${data.good.map(g=>`<li>${escapeHtml(g)}</li>`).join('')}</ul></div>` : ''}
    ${(data.improve && data.improve.length) ? `<div class="review-section"><h4>🔧 Can Improve</h4><ul class="review-list improve">${data.improve.map(im=>`<li><b>${escapeHtml(im.issue || '')}</b>${escapeHtml(im.tip || '')}</li>`).join('')}</ul></div>` : ''}
  `;
  outputArea.appendChild(card);

  requestAnimationFrame(()=>{
    setTimeout(()=>{
      const fill = card.querySelector('.score-ring-fill');
      if(fill) fill.style.strokeDashoffset = offset;
    }, 80);
  });

  speak(`Your code scored ${score} out of 100. ${data.summary || ''}`);
}
</script>
</body>
</html>
