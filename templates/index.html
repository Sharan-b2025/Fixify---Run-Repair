<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fixify — Run &amp; Repair</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%237c5cff%22/><text x=%2250%22 y=%2268%22 font-size=%2260%22 font-family=%22sans-serif%22 fill=%22%2305060a%22 text-anchor=%22middle%22>F</text></svg>">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#05060a;
  --panel:#0b0d14;
  --panel2:#0e1119;
  --border:#1c2230;
  --accent:#7c5cff;
  --accent2:#00e6c3;
  --danger:#ff4d6d;
  --success:#3ddc97;
  --warn:#ffb454;
  --text:#e7e9f0;
  --muted:#8890a6;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Space Grotesk', sans-serif;
  overflow:hidden;
  position:relative;
}

#bg-canvas{position:fixed; inset:0; z-index:0; opacity:.5;}
.glow-orb{
  position:fixed; border-radius:50%; filter:blur(90px); z-index:0; pointer-events:none;
  animation:float 12s ease-in-out infinite;
}
.orb1{width:420px;height:420px; background:radial-gradient(circle, var(--accent), transparent 70%); top:-150px; left:-100px; opacity:.35;}
.orb2{width:380px;height:380px; background:radial-gradient(circle, var(--accent2), transparent 70%); bottom:-140px; right:-100px; opacity:.3; animation-delay:3s;}
@keyframes float{
  0%,100%{transform:translateY(0) translateX(0);}
  50%{transform:translateY(30px) translateX(20px);}
}

header{
  position:relative; z-index:2;
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 26px;
  background:rgba(11,13,20,.85);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
}
.brand{display:flex; align-items:center; gap:10px;}
.brand .logo{
  width:36px; height:36px; border-radius:10px;
  background:linear-gradient(135deg, var(--accent), var(--accent2));
  display:flex; align-items:center; justify-content:center;
  font-weight:700; font-size:18px; color:#05060a;
  box-shadow:0 0 22px rgba(124,92,255,.6);
  animation:pulseLogo 3s ease-in-out infinite;
}
@keyframes pulseLogo{0%,100%{box-shadow:0 0 14px rgba(124,92,255,.5);}50%{box-shadow:0 0 30px rgba(0,230,195,.7);}}
.brand h1{font-size:19px; font-weight:700; letter-spacing:.3px;}
.brand h1 span{color:var(--accent2);}
.brand small{display:block; color:var(--muted); font-size:11px; font-weight:400; margin-top:1px;}

.header-controls{display:flex; align-items:center; gap:10px;}
select, .icon-btn{
  background:var(--panel2); color:var(--text); border:1px solid var(--border);
  border-radius:8px; padding:8px 12px; font-family:inherit; font-size:13px;
  cursor:pointer; transition:.2s;
}
select:hover, .icon-btn:hover{border-color:var(--accent); box-shadow:0 0 10px rgba(124,92,255,.35);}
.icon-btn{display:flex; align-items:center; gap:6px;}
#voiceToggle.active{color:var(--accent2); border-color:var(--accent2);}

.split{
  position:relative; z-index:1;
  display:flex; height:calc(100vh - 63px);
}
.pane{
  flex:1; display:flex; flex-direction:column;
  background:var(--panel);
  border-right:1px solid var(--border);
  position:relative;
  transition:flex .35s ease;
}
.pane:last-child{border-right:none;}
.pane.fullscreen-pane{flex:1 !important; width:100%;}

.pane-head{
  display:flex; align-items:center; justify-content:space-between;
  padding:10px 16px; border-bottom:1px solid var(--border);
  background:var(--panel2);
}
.pane-head .dots{display:flex; gap:6px;}
.pane-head .dots span{width:10px; height:10px; border-radius:50%;}
.dots span:nth-child(1){background:#ff5f56;}
.dots span:nth-child(2){background:#ffbd2e;}
.dots span:nth-child(3){background:#27c93f;}
.pane-title{font-size:13px; color:var(--muted); font-weight:600; letter-spacing:.4px; text-transform:uppercase;}
.pane-actions{display:flex; gap:8px;}
.mini-btn{
  background:transparent; border:1px solid var(--border); color:var(--muted);
  border-radius:6px; padding:5px 8px; cursor:pointer; font-size:12px; transition:.2s;
}
.mini-btn:hover{color:var(--text); border-color:var(--accent2); box-shadow:0 0 8px rgba(0,230,195,.3);}

.CodeMirror{
  flex:1; height:100% !important; font-family:'JetBrains Mono', monospace !important;
  font-size:14.5px; line-height:1.55; background:var(--panel) !important;
}
.editor-wrap{flex:1; overflow:hidden; position:relative;}

.cm-error-line{
  background:rgba(255,77,109,.14) !important;
  animation:errorLineIn .4s ease;
}
.cm-error-line .CodeMirror-linenumber{
  color:var(--danger) !important;
  font-weight:800;
}
.cm-error-gutter{
  color:var(--danger) !important;
  font-weight:800;
}
@keyframes errorLineIn{
  0%{background:rgba(255,77,109,.4) !important;}
  100%{background:rgba(255,77,109,.14) !important;}
}
.cm-error-token{
  text-decoration:underline wavy var(--danger);
  text-decoration-thickness:2px;
  text-underline-offset:3px;
  background:rgba(255,77,109,.18);
  border-radius:3px;
}

.left-footer{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:12px 16px; border-top:1px solid var(--border); background:var(--panel2);
}
.run-btn{
  position:relative; overflow:hidden;
  background:linear-gradient(135deg, var(--accent), #5a3ff0);
  color:#fff; border:none; padding:11px 22px; border-radius:10px;
  font-family:inherit; font-weight:700; font-size:14px; cursor:pointer;
  display:flex; align-items:center; gap:8px;
  box-shadow:0 4px 20px rgba(124,92,255,.4);
  transition:transform .15s ease, box-shadow .15s ease;
}
.run-btn:hover{transform:translateY(-2px); box-shadow:0 6px 26px rgba(124,92,255,.6);}
.run-btn:active{transform:translateY(0);}
.run-btn.loading{pointer-events:none; opacity:.85;}
.run-btn .spinner{
  width:15px; height:15px; border-radius:50%;
  border:2px solid rgba(255,255,255,.35); border-top-color:#fff;
  animation:spin .7s linear infinite; display:none;
}
.run-btn.loading .spinner{display:inline-block;}
.run-btn.loading .play-icon{display:none;}
@keyframes spin{to{transform:rotate(360deg);}}

.stat-chip{font-size:11.5px; color:var(--muted); display:flex; gap:14px;}
.stat-chip span b{color:var(--text);}

.output-area{
  flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:16px;
}
.output-area::-webkit-scrollbar{width:8px;}
.output-area::-webkit-scrollbar-thumb{background:var(--border); border-radius:4px;}

.placeholder{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  color:var(--muted); text-align:center; gap:10px; animation:fadeIn .6s ease;
}
.placeholder .big-icon{font-size:46px; opacity:.5; animation:bob 3s ease-in-out infinite;}
@keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}

@keyframes fadeIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}
@keyframes popIn{
  0%{opacity:0; transform:scale(.92) translateY(10px);}
  100%{opacity:1; transform:scale(1) translateY(0);}
}

.card{
  border-radius:14px; padding:18px; border:1px solid var(--border);
  background:linear-gradient(180deg, var(--panel2), var(--panel));
  animation:popIn .45s cubic-bezier(.2,.9,.25,1) both;
}
.card.success{border-color:rgba(61,220,151,.4); box-shadow:0 0 24px rgba(61,220,151,.08);}
.card.error{border-color:rgba(255,77,109,.4); box-shadow:0 0 24px rgba(255,77,109,.1);}

.card-title{display:flex; align-items:center; gap:10px; font-weight:700; font-size:15px; margin-bottom:10px;}
.status-badge{
  font-size:11px; font-weight:700; padding:4px 10px; border-radius:20px; letter-spacing:.5px; text-transform:uppercase;
}
.status-badge.success{background:rgba(61,220,151,.15); color:var(--success);}
.status-badge.error{background:rgba(255,77,109,.15); color:var(--danger);}

.line-tag{
  display:inline-flex; align-items:center; gap:6px; background:rgba(255,77,109,.12);
  color:var(--danger); border:1px solid rgba(255,77,109,.35); padding:4px 10px;
  border-radius:8px; font-family:'JetBrains Mono',monospace; font-size:12.5px; margin-bottom:10px;
  transition:.2s;
}
button.line-tag{cursor:pointer;}
button.line-tag:hover{background:rgba(255,77,109,.25); box-shadow:0 0 10px rgba(255,77,109,.35); transform:translateY(-1px);}
.err-msg{font-size:13.5px; color:var(--text); line-height:1.6; margin-bottom:12px;}

.fix-reason{
  display:flex; gap:10px; align-items:flex-start;
  background:rgba(124,92,255,.1); border:1px solid rgba(124,92,255,.35);
  padding:12px 14px; border-radius:10px; font-size:13px; color:#d9d5ff; line-height:1.5;
}
.fix-reason .mic{
  flex-shrink:0; width:26px; height:26px; border-radius:50%;
  background:var(--accent); display:flex; align-items:center; justify-content:center; font-size:13px;
}
.mic.speaking{animation:micPulse 1s ease-in-out infinite;}
@keyframes micPulse{0%,100%{box-shadow:0 0 0 0 rgba(124,92,255,.6);}50%{box-shadow:0 0 0 8px rgba(124,92,255,0);}}

pre.code-block{
  background:#05060a; border:1px solid var(--border); border-radius:10px;
  padding:14px; font-family:'JetBrains Mono',monospace; font-size:13px; line-height:1.6;
  overflow-x:auto; white-space:pre; color:#c9f7e6; max-height:280px; overflow-y:auto;
}
pre.code-block::-webkit-scrollbar{height:6px; width:6px;}
pre.code-block::-webkit-scrollbar-thumb{background:var(--border); border-radius:3px;}

.section-label{font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); margin:14px 0 8px; font-weight:700;}
.section-label .hint{color:var(--muted); font-weight:400; text-transform:none; font-size:11px; letter-spacing:0;}
.suggestion-list{list-style:none; display:flex; flex-direction:column; gap:8px;}
.tip-item{
  font-size:13px; color:var(--text); background:rgba(255,255,255,.03);
  padding:9px 12px; border-radius:8px; border:1px solid var(--border);
  cursor:pointer; transition:.2s;
}
.tip-item:hover{border-color:var(--accent); background:rgba(124,92,255,.06);}
.tip-row{display:flex; align-items:center; gap:8px;}
.tip-row::before{content:"💡"; flex-shrink:0;}
.tip-arrow{margin-left:auto; color:var(--muted); transition:transform .2s ease; font-size:11px; flex-shrink:0;}
.tip-item.open .tip-arrow{transform:rotate(90deg); color:var(--accent2);}
.tip-detail{
  max-height:0; opacity:0; overflow:hidden; transition:max-height .25s ease, opacity .2s ease, margin .25s ease;
  font-size:12px; color:var(--muted); line-height:1.5; padding-left:24px; border-left:2px solid var(--accent);
  margin-top:0;
}
.tip-item.open .tip-detail{max-height:200px; opacity:1; margin-top:8px;}

.apply-fix-btn{
  margin-top:12px; background:linear-gradient(135deg, var(--accent2), #00b39c); color:#04211c;
  border:none; padding:9px 16px; border-radius:8px; font-weight:700; font-size:12.5px;
  cursor:pointer; transition:.2s;
}
.apply-fix-btn:hover{transform:translateY(-1px); box-shadow:0 4px 16px rgba(0,230,195,.4);}

.toast{
  position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px);
  background:var(--panel2); border:1px solid var(--accent); color:var(--text);
  padding:10px 18px; border-radius:10px; font-size:13px; z-index:50; opacity:0;
  transition:.3s; pointer-events:none;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

.fs-hide{display:none !important;}

@media (max-width:820px){
  .split{flex-direction:column; height:auto;}
  .pane{border-right:none; border-bottom:1px solid var(--border);}
  .CodeMirror{height:340px !important;}
}
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<div class="glow-orb orb1"></div>
<div class="glow-orb orb2"></div>

<header>
  <div class="brand">
    <div class="logo">F</div>
    <div>
      <h1>Fixify <span>Run &amp; Repair</span></h1>
      <small>AI code debugger &amp; compiler · powered by Gemini</small>
    </div>
  </div>
  <div class="header-controls">
    <select id="langSelect">
      <option value="auto">Auto-detect</option>
      <option value="python">Python</option>
      <option value="javascript">JavaScript</option>
      <option value="c">C</option>
      <option value="cpp">C++</option>
      <option value="java">Java</option>
      <option value="go">Go</option>
      <option value="html">HTML</option>
      <option value="sql">SQL</option>
    </select>
    <button class="icon-btn" id="voiceToggle" title="Toggle voice narration">🔊 Voice: On</button>
  </div>
</header>

<div class="split" id="splitView">
  <!-- LEFT: CODE -->
  <div class="pane" id="leftPane">
    <div class="pane-head">
      <div class="dots"><span></span><span></span><span></span></div>
      <div class="pane-title">Your Code</div>
      <div class="pane-actions">
        <button class="mini-btn" id="clearBtn">Clear</button>
        <button class="mini-btn" id="sampleBtn">Sample</button>
        <button class="mini-btn" id="fsLeftBtn">⛶ Fullscreen</button>
      </div>
    </div>
    <div class="editor-wrap"><textarea id="codeInput"></textarea></div>
    <div class="left-footer">
      <button class="run-btn" id="analyzeBtn">
        <span class="spinner"></span>
        <span class="play-icon">▶</span>
        <span id="runLabel">Analyze Code</span>
      </button>
      <div class="stat-chip">
        <span>Lines: <b id="lineCount">0</b></span>
        <span>Chars: <b id="charCount">0</b></span>
      </div>
    </div>
  </div>

  <!-- RIGHT: RESULT -->
  <div class="pane" id="rightPane">
    <div class="pane-head">
      <div class="dots"><span></span><span></span><span></span></div>
      <div class="pane-title">Result</div>
      <div class="pane-actions">
        <button class="mini-btn" id="stopVoiceBtn">🔇 Stop</button>
        <button class="mini-btn" id="fsRightBtn">⛶ Fullscreen</button>
      </div>
    </div>
    <div class="output-area" id="outputArea">
      <div class="placeholder" id="placeholder">
        <div class="big-icon">🛠️</div>
        <div>Paste your code on the left and hit <b>Analyze Code</b>.<br>Fixify will run it, catch errors, and talk you through the fix.</div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/sql/sql.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/go/go.min.js"></script>

<script>
const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');
function resize(){canvas.width = innerWidth; canvas.height = innerHeight;}
resize(); addEventListener('resize', resize);
const particles = Array.from({length: 60}, () => ({
  x: Math.random()*innerWidth, y: Math.random()*innerHeight,
  r: Math.random()*1.6+0.4, vx:(Math.random()-.5)*.25, vy:(Math.random()-.5)*.25
}));
function loop(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = 'rgba(124,92,255,.5)';
  particles.forEach(p=>{
    p.x+=p.vx; p.y+=p.vy;
    if(p.x<0||p.x>innerWidth) p.vx*=-1;
    if(p.y<0||p.y>innerHeight) p.vy*=-1;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill();
  });
  requestAnimationFrame(loop);
}
loop();

const modeMap = {
  auto:'python', python:'python', javascript:'javascript', c:'text/x-csrc',
  cpp:'text/x-c++src', java:'text/x-java', go:'go', html:'htmlmixed', sql:'sql'
};
const editor = CodeMirror.fromTextArea(document.getElementById('codeInput'), {
  mode:'python', theme:'dracula', lineNumbers:true, tabSize:4, indentUnit:4,
  autoCloseBrackets:true, matchBrackets:true, lineWrapping:false
});

const SAMPLE = `def greet(name):
    print("Hello, " + name

greet("Fixify")`;
editor.setValue(SAMPLE);
updateStats();

editor.on('change', ()=>{ updateStats(); clearErrorHighlight(); });
function updateStats(){
  const val = editor.getValue();
  document.getElementById('lineCount').textContent = editor.lineCount();
  document.getElementById('charCount').textContent = val.length;
}

document.getElementById('langSelect').addEventListener('change', e=>{
  editor.setOption('mode', modeMap[e.target.value] || 'python');
});
document.getElementById('clearBtn').addEventListener('click', ()=>{editor.setValue(''); clearErrorHighlight(); editor.focus();});
document.getElementById('sampleBtn').addEventListener('click', ()=>{editor.setValue(SAMPLE); clearErrorHighlight(); showToast('Sample loaded');});

let errorLineHandles = [];
let errorMarks = [];

function clearErrorHighlight(){
  errorLineHandles.forEach(lineIdx => {
    editor.removeLineClass(lineIdx, 'background', 'cm-error-line');
    editor.removeLineClass(lineIdx, 'gutter', 'cm-error-gutter');
  });
  errorLineHandles = [];
  errorMarks.forEach(m => m.clear());
  errorMarks = [];
}

function markErrorToken(lineIdx, errorTitle, errorMessage){
  const lineText = editor.getLine(lineIdx);
  if(!lineText) return;

  const combined = `${errorTitle || ''} ${errorMessage || ''}`;
  const quoted = [...combined.matchAll(/['"`]([^'"`]{1,40})['"`]/g)].map(m => m[1]).filter(Boolean);

  const seen = new Set();
  let matched = false;
  for(const token of quoted){
    if(seen.has(token)) continue;
    seen.add(token);
    const idx = lineText.indexOf(token);
    if(idx !== -1){
      const mark = editor.markText(
        {line: lineIdx, ch: idx},
        {line: lineIdx, ch: idx + token.length},
        {className: 'cm-error-token'}
      );
      errorMarks.push(mark);
      matched = true;
    }
  }

  if(!matched){
    const start = lineText.length - lineText.trimStart().length;
    const end = lineText.trimEnd().length;
    if(end > start){
      const mark = editor.markText(
        {line: lineIdx, ch: start},
        {line: lineIdx, ch: end},
        {className: 'cm-error-token'}
      );
      errorMarks.push(mark);
    }
  }
}

function highlightErrorLines(errors){
  clearErrorHighlight();
  if(!errors || !errors.length) return;

  errors.forEach(err => {
    if(!err.line || err.line < 1) return;
    const lineIdx = err.line - 1;
    if(lineIdx >= editor.lineCount()) return;

    errorLineHandles.push(lineIdx);
    editor.addLineClass(lineIdx, 'background', 'cm-error-line');
    editor.addLineClass(lineIdx, 'gutter', 'cm-error-gutter');
    markErrorToken(lineIdx, err.title, err.message);
  });

  if(errors[0] && errors[0].line){
    editor.scrollIntoView({line: errors[0].line - 1, ch: 0}, 120);
  }
}

function jumpToLine(lineNumber1Indexed){
  if(!lineNumber1Indexed || lineNumber1Indexed < 1) return;
  const lineIdx = lineNumber1Indexed - 1;
  if(lineIdx >= editor.lineCount()) return;
  editor.focus();
  editor.setCursor({line: lineIdx, ch: editor.getLine(lineIdx).length});
  editor.scrollIntoView({line: lineIdx, ch: 0}, 120);
}

function toggleFullscreenPane(paneEl){
  const el = paneEl;
  if(!document.fullscreenElement){
    el.requestFullscreen?.() || el.webkitRequestFullscreen?.();
  } else {
    document.exitFullscreen?.() || document.webkitExitFullscreen?.();
  }
}
document.getElementById('fsLeftBtn').addEventListener('click', ()=>toggleFullscreenPane(document.getElementById('leftPane')));
document.getElementById('fsRightBtn').addEventListener('click', ()=>toggleFullscreenPane(document.getElementById('rightPane')));
document.addEventListener('fullscreenchange', ()=>{ setTimeout(()=>editor.refresh(), 150); });

let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

let voiceOn = true;
const voiceToggle = document.getElementById('voiceToggle');
voiceToggle.addEventListener('click', ()=>{
  voiceOn = !voiceOn;
  voiceToggle.textContent = voiceOn ? '🔊 Voice: On' : '🔈 Voice: Off';
  voiceToggle.classList.toggle('active', voiceOn);
  if(!voiceOn) speechSynthesis.cancel();
});
document.getElementById('stopVoiceBtn').addEventListener('click', ()=>speechSynthesis.cancel());

function speak(text, micEl){
  if(!voiceOn || !('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.rate = 1; utter.pitch = 1;
  if(micEl){
    utter.onstart = ()=>micEl.classList.add('speaking');
    utter.onend = ()=>micEl.classList.remove('speaking');
  }
  speechSynthesis.speak(utter);
}

const analyzeBtn = document.getElementById('analyzeBtn');
const outputArea = document.getElementById('outputArea');
const runLabel = document.getElementById('runLabel');

analyzeBtn.addEventListener('click', runAnalysis);
document.addEventListener('keydown', e=>{
  if((e.ctrlKey || e.metaKey) && e.key === 'Enter') runAnalysis();
});

async function runAnalysis(){
  const code = editor.getValue();
  const language = document.getElementById('langSelect').value;
  clearErrorHighlight();
  analyzeBtn.classList.add('loading');
  runLabel.textContent = 'Analyzing...';

  try{
    const res = await fetch('/analyze', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({code, language})
    });
    const data = await res.json();
    renderResult(data);
  }catch(err){
    renderResult({
      status:'error',
      errors:[{ line:null, title:'Network Error',
        message:'Could not reach the Fixify server. Check your connection.',
        fix_reason:'A working connection is needed to analyze your code.' }],
      fixed_code:'', output:'', suggestions:[]
    });
  }finally{
    analyzeBtn.classList.remove('loading');
    runLabel.textContent = 'Analyze Code';
  }
}

function renderResult(data){
  document.getElementById('placeholder')?.remove();
  outputArea.innerHTML = '';

  const isSuccess = data.status === 'success';
  const errors = data.errors || [];

  if(isSuccess){
    clearErrorHighlight();

    const card = document.createElement('div');
    card.className = 'card success';
    let html = `<div class="card-title">✅ Code Runs Perfectly
        <span class="status-badge success">Success</span>
      </div>
      <div class="section-label">Program Output</div>
      <pre class="code-block">${escapeHtml(data.output || '(no output)')}</pre>`;

    if(data.fix_reason){
      html += `<div class="fix-reason"><div class="mic" id="micIcon">🎙️</div><div>${escapeHtml(data.fix_reason)}</div></div>`;
    }

    html += buildSuggestionsHtml(data.suggestions);
    card.innerHTML = html;
    outputArea.appendChild(card);
    wireSuggestionToggles(card);

    speak('Your code ran successfully with no errors.');
    return;
  }

  highlightErrorLines(errors);

  const summaryCard = document.createElement('div');
  summaryCard.className = 'card error';
  summaryCard.innerHTML = `<div class="card-title">⚠️ ${errors.length} ${errors.length === 1 ? 'Issue' : 'Issues'} Found
      <span class="status-badge error">Error</span>
    </div>
    <div class="err-msg">Fix these one at a time, starting from the top. Click a line number to jump straight to it in your code.</div>`;
  outputArea.appendChild(summaryCard);

  errors.forEach((err, i) => {
    const card = document.createElement('div');
    card.className = 'card error';
    card.style.animationDelay = (i * 0.08) + 's';

    let html = `<div class="card-title">🔴 ${escapeHtml(err.title || 'Error ' + (i+1))}</div>`;
    if(err.line){
      html += `<button class="line-tag" data-line="${err.line}" style="cursor:pointer; border:1px solid rgba(255,77,109,.35); background:rgba(255,77,109,.12);">📍 Line ${err.line} — click to jump</button>`;
    }
    html += `<div class="err-msg">${escapeHtml(err.message || '')}</div>`;
    if(err.fix_reason){
      html += `<div class="fix-reason"><div class="mic" data-mic="${i}">🎙️</div><div>${escapeHtml(err.fix_reason)}</div></div>`;
    }

    card.innerHTML = html;
    outputArea.appendChild(card);
  });

  if(data.fixed_code){
    const fixCard = document.createElement('div');
    fixCard.className = 'card success';
    fixCard.innerHTML = `<div class="section-label">Suggested Fix (all errors corrected)</div>
      <pre class="code-block">${escapeHtml(data.fixed_code)}</pre>
      <button class="apply-fix-btn" id="applyFixBtn">⤵ Apply Fix to Editor</button>`;
    outputArea.appendChild(fixCard);

    document.getElementById('applyFixBtn').addEventListener('click', ()=>{
      editor.setValue(data.fixed_code);
      clearErrorHighlight();
      showToast('Fix applied to editor ✔');
    });
  }

  if(data.suggestions && data.suggestions.length){
    const tipsCard = document.createElement('div');
    tipsCard.className = 'card';
    tipsCard.innerHTML = buildSuggestionsHtml(data.suggestions);
    outputArea.appendChild(tipsCard);
    wireSuggestionToggles(tipsCard);
  }

  outputArea.querySelectorAll('.line-tag[data-line]').forEach(btn=>{
    btn.addEventListener('click', ()=> jumpToLine(parseInt(btn.dataset.line, 10)));
  });

  if(errors.length){
    const spoken = errors.length === 1
      ? errors[0].fix_reason || `There is one error on line ${errors[0].line}.`
      : `I found ${errors.length} errors in your code. Check each highlighted line, starting from the top.`;
    speak(spoken);
  }
}

function buildSuggestionsHtml(suggestions){
  if(!suggestions || !suggestions.length) return '';
  return `<div class="section-label">Extra Tips <span class="hint">(tap to expand)</span></div>
    <ul class="suggestion-list">${suggestions.map((s, i)=>{
      const tip = typeof s === 'string' ? s : (s.tip || '');
      const why = typeof s === 'string' ? '' : (s.why || '');
      return `<li class="tip-item" data-idx="${i}">
          <div class="tip-row"><span>${escapeHtml(tip)}</span><span class="tip-arrow">▸</span></div>
          ${why ? `<div class="tip-detail">${escapeHtml(why)}</div>` : ''}
        </li>`;
    }).join('')}</ul>`;
}

function wireSuggestionToggles(scopeEl){
  scopeEl.querySelectorAll('.tip-item').forEach(li=>{
    if(li.querySelector('.tip-detail')){
      li.addEventListener('click', ()=> li.classList.toggle('open'));
    } else {
      li.style.cursor = 'default';
    }
  });
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str ?? '';
  return div.innerHTML;
}
</script>
</body>
</html>
